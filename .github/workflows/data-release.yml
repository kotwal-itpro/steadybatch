# On the 1st of each month, publish the tracker data so far as a new version of a Zenodo dataset,
# so the data has its own citable DOI, separate from the library's.
# Needs a Zenodo personal access token (scopes deposit:write and deposit:actions) saved as the
# ZENODO_TOKEN secret; without it the job does nothing. Set the repository variable
# ZENODO_SANDBOX=true to try it against sandbox.zenodo.org first.
name: data-release

on:
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-release   # not "tracker": a queued run here must never replace a queued tracker run
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Publish to Zenodo
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          ZENODO_SANDBOX: ${{ vars.ZENODO_SANDBOX }}
        run: python scripts/zenodo_snapshot.py --state tracker/zenodo.json
      - name: Commit the new record ID
        run: |
          git config user.name "steadybatch-tracker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tracker/zenodo.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "tracker: data release $(date -u +%Y-%m)"
          pushed=0; for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && pushed=1 && break; sleep 5; done; [ "$pushed" = 1 ]
