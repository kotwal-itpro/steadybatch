name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Smoke-test the benchmark with the fake provider
        run: |
          python examples/make_synthetic.py --n 300 > examples/support_tickets.jsonl
          steadybatch-bench run --provider fake --model fake \
            --data examples/support_tickets.jsonl --schema examples/support_ticket.schema.json \
            --out runs/ci --prices examples/prices.example.json --poll-every 0
          steadybatch-bench report runs/ci --out results-ci
