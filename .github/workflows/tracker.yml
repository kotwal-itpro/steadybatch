# Batch API tracker (docs/TRACKER-DESIGN.md).
# Sends one 200-record batch per provider at 01:00 and 13:00 UTC, collects finished
# batches every 30 minutes, commits the data and republishes the page.
# Runs only on schedule or by hand, never on pull requests, so forks can't reach the keys.
name: tracker

on:
  schedule:
    - cron: "0 1,13 * * *"     # submit slots
    - cron: "*/30 * * * *"     # collect
  workflow_dispatch:
    inputs:
      submit:
        description: "Also submit a round now (counts toward the daily cap)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[openai,gemini,anthropic]"

      - name: Submit
        if: github.event.schedule == '0 1,13 * * *' || inputs.submit
        run: steadybatch-track submit

      - name: Collect
        run: steadybatch-track collect

      - name: Commit data
        id: commit
        run: |
          git config user.name "steadybatch-tracker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tracker/open.json tracker/data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "tracker: data $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build page
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: steadybatch-track site --out _site
      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
