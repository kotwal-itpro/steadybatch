# Batch API tracker (docs/TRACKER-DESIGN.md).
# Sends one 200-record batch per provider at 01:00, 07:00, 13:00 and 19:00 UTC (plus a weekly
# 5,000-record batch in the 13:00 slot), collects finished batches every 30 minutes, opens an issue
# for serious incidents, commits the data and republishes the page.
# Runs only on schedule or by hand, never on pull requests, so forks can't reach the keys.
name: tracker

on:
  schedule:
    - cron: "0 1,7,13,19 * * *"   # submit slots
    - cron: "*/30 * * * *"     # collect
  workflow_dispatch:
    inputs:
      submit:
        description: "Also submit a round now (counts toward the daily cap)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[openai,gemini,anthropic]"

      - name: Submit
        if: github.event.schedule == '0 1,7,13,19 * * *' || inputs.submit
        run: steadybatch-track submit

      - name: Collect
        run: steadybatch-track collect

      - name: Open issues for new serious incidents
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          steadybatch-track issues --out "$RUNNER_TEMP/issues.json"
          n=$(jq length "$RUNNER_TEMP/issues.json")
          if [ "$n" -gt 0 ]; then
            gh label create tracker-incident --color c4302b --description "Opened by the batch API tracker" --force
            for i in $(seq 0 $((n - 1))); do
              gh issue create --label tracker-incident \
                --title "$(jq -r ".[$i].title" "$RUNNER_TEMP/issues.json")" \
                --body "$(jq -r ".[$i].body" "$RUNNER_TEMP/issues.json")" || echo "could not open issue $i"
            done
          fi

      - name: Commit data
        id: commit
        run: |
          git config user.name "steadybatch-tracker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tracker/open.json tracker/data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "tracker: data $(date -u +%Y-%m-%dT%H:%MZ)"
            pushed=0; for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && pushed=1 && break; sleep 5; done; [ "$pushed" = 1 ]
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build page
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: steadybatch-track site --out _site
      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
