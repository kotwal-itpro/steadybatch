[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "steadybatch"
version = "0.2.1"
description = "Run millions of LLM requests through batch APIs without silent failures."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Ankur Partap Kotwal", email = "kotwal.itpro@gmail.com" }]
keywords = ["llm", "batch", "inference", "openai", "anthropic", "gemini", "vllm", "reliability", "benchmark"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: System :: Distributed Computing",
]
dependencies = ["jsonschema>=4.0"]

[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=1.0"]
gemini = ["google-genai>=1.20"]
vllm = ["vllm>=0.6"]
report = ["matplotlib>=3.7"]
dev = ["pytest>=8"]

[project.scripts]
steadybatch-bench = "steadybatch.bench:main"

[project.urls]
Homepage = "https://github.com/kotwal-itpro/steadybatch"
Documentation = "https://github.com/kotwal-itpro/steadybatch/blob/main/docs/GUIDE.md"
Findings = "https://github.com/kotwal-itpro/steadybatch/blob/main/docs/FINDINGS.md"
Issues = "https://github.com/kotwal-itpro/steadybatch/issues"
DOI = "https://doi.org/10.5281/zenodo.23221956"

[tool.hatch.build.targets.wheel]
packages = ["src/steadybatch"]

[tool.hatch.build.targets.sdist]
# Keep the source package small: benchmark results and generated data live on GitHub.
exclude = ["/results", "/runs", "/examples/*.jsonl", "/.github", "/scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
